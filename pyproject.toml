[project]
name = "hm-dianping-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mushinid", email = "2459554250@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hm-dianping-py = "hm_dianping_py:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
